<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>inspect</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --muted: #59636e; --line: #d0d7de; --bg: #fff; --ok: #116329; --bad: #a40e26; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --muted: #9198a1; --line: #3d444d; --bg: #0d1117; --ok: #6fdd8b; --bad: #ff8182; }
    }
    body { margin: 0; width: 320px; padding: 14px 16px; font: 13px/1.45 system-ui, sans-serif; color: var(--fg); background: var(--bg); }
    h1 { font-size: 15px; margin: 0 0 4px; }
    p { margin: 0 0 12px; color: var(--muted); }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: inherit; font: 12px ui-monospace, monospace; }
    .row { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; font-weight: 600; cursor: pointer; }
    #status { margin-top: 10px; min-height: 1.4em; }
    .ok { color: var(--ok); }
    .bad { color: var(--bad); }
    code { font: 12px ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>inspect</h1>
  <p>Run <code>inspect serve</code> in a terminal, then paste the token it prints.</p>

  <label for="token">Pairing token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">

  <label for="port">Port</label>
  <input id="port" type="number" min="1" max="65535" value="7878">

  <div class="row">
    <button id="save" type="button">Save</button>
    <button id="test" type="button">Test connection</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
